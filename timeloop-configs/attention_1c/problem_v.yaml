# P . V as a GEMM in the same conv-style shape:
#   C (contraction)      = seq_len_k          = 8192
#   M (Weights free dim) = d_head             = 128   <- V, the stationary
#                                                         operand
#   N (Inputs/Outputs free dim)               = seq_len_q * heads_per_group
#                                              = 65536
#   G (outer, independent instances)          = batch * num_kv_heads = 256
# Sanity check: C*M*N*G = 2^13 * 2^7 * 2^16 * 2^8 = 2^44 MACs = 2^45 FLOPs,
# matching QK^T exactly (as Phase 1a proved by hand).
problem:
  version: 0.4
  instance:
    N: 65536
    C: 8192
    H: 1
    W: 1
    G: 256
    R: 1
    S: 1
    Hdilation: 1
    Hstride: 1
    Wdilation: 1
    Wstride: 1
    M: 128
    P: 1
    Q: 1
  shape:
    name: pv_gemm
    coefficients:
    - {name: Wstride, default: 1}
    - {name: Hstride, default: 1}
    - {name: Wdilation, default: 1}
    - {name: Hdilation, default: 1}
    data_spaces:
    - name: Weights
      projection:
      - - - C
      - - - M
      - - - R
      - - - S
      - - - G
    - name: Inputs
      projection:
      - - - N
      - - - C
      - - - R
          - Wdilation
        - - P
          - Wstride
      - - - S
          - Hdilation
        - - Q
          - Hstride
      - - - G
    - name: Outputs
      projection:
      - - - N
      - - - M
      - - - Q
      - - - P
      - - - G
      read_write: true
    dimensions:
    - C
    - M
    - R
    - S
    - N
    - P
    - Q
    - G
